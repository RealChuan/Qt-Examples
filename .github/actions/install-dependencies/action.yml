name: "Install Build Dependencies"
description: "Install vcpkg libraries and Qt environment for cross-platform builds"

inputs:
  qt_modules:
    description: "Qt modules to install"
    required: false
    default: "qt5compat qtnetworkauth qtimageformats"
    type: string
  qt_ver:
    description: "Qt version to install"
    required: false
    default: "6.12.0"
    type: string

runs:
  using: "composite"

  steps:
    - name: Install dependencies on windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        ninja --version
        cmake --version

    - name: Install dependencies on macos
      if: runner.os == 'macOS'
      shell: bash
      run: |
        ninja --version
        cmake --version
        clang --version

    - name: Install dependencies on linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build build-essential libgl1-mesa-dev clang lintian tree
        ninja --version
        cmake --version
        gcc --version

    # ---------------- Qt ----------------
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt_ver }}
        modules: ${{ inputs.qt_modules }}
        cache: true
