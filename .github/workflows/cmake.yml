name: CMake Build

on:
  push:
    paths-ignore:
      - "docs/**"
      - "packaging/version.txt"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "packaging/version.txt"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"

env:
  MACOSX_DEPLOYMENT_TARGET: "14.4"
  MACOSX_BUILD_ARCHS: "x86_64;arm64"
  BUILD_DIR: build
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
        generators:
          - "Ninja"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure, build and test windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\windows\Enter-VsDevShell.ps1
          cmake `
            -S . `
            -B "${{ env.BUILD_DIR }}" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TESTS=ON `
            -G "${{ matrix.generators }}"
          cmake --build "${{ env.BUILD_DIR }}" --config ${{ env.BUILD_TYPE }}
          ctest --test-dir "${{ env.BUILD_DIR }}" --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Configure, build and test linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake \
            -S . \
            -B "${{ env.BUILD_DIR }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTS=ON \
            -G "${{ matrix.generators }}"
          cmake --build "${{ env.BUILD_DIR }}" --config ${{ env.BUILD_TYPE }}
          ctest --test-dir "${{ env.BUILD_DIR }}" --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Configure, build and test macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake \
            -S . \
            -B "${{ env.BUILD_DIR }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="${{ env.MACOSX_BUILD_ARCHS }}" \
            -DBUILD_TESTS=ON \
            -G "${{ matrix.generators }}"
          cmake --build "${{ env.BUILD_DIR }}" --config ${{ env.BUILD_TYPE }}
          ctest --test-dir "${{ env.BUILD_DIR }}" --build-config ${{ env.BUILD_TYPE }} --output-on-failure
