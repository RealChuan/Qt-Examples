name: QMake Build

on:
  push:
    paths-ignore:
      - "cmake/**"
      - "docs/**"
      - "packaging/**"
      - "translations/**"
      - "**/CMakeLists.txt"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/LICENSE*"
      - "**/README*"
      - "vcpkg.json"
  pull_request:
    paths-ignore:
      - "cmake/**"
      - "docs/**"
      - "packaging/**"
      - "translations/**"
      - "**/CMakeLists.txt"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/LICENSE*"
      - "**/README*"
      - "vcpkg.json"

env:
  MACOSX_DEPLOYMENT_TARGET: "14.4"
  MACOSX_BUILD_ARCHS: "x86_64 arm64"
  BUILD_DIR: build

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install-dependencies

      - uses: RealChuan/setup-jom@main

      - name: Create build directory
        shell: bash
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: QMake and build windows
        if: runner.os == 'Windows'
        working-directory: ${{ env.BUILD_DIR }}
        shell: pwsh
        run: |
          ..\packaging\windows\Enter-VsDevShell.ps1
          & qmake ..\.
          & jom

      - name: QMake and build linux
        if: runner.os == 'Linux'
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          qmake ../.
          make -j $(nproc)

      - name: QMake and build macos
        if: runner.os == 'macOS'
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          qmake QMAKE_APPLE_DEVICE_ARCHS="${{ env.MACOSX_BUILD_ARCHS }}" ../.
          make -j $(sysctl -n hw.ncpu)
